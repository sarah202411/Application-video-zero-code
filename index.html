<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAzure — Plateforme MediaOnDemand</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e50914; --black: #0a0a0a; --card: #1c1c1c; --text: #e5e5e5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--text); padding-bottom: 50px; min-height: 100vh; }
        nav { background: rgba(0,0,0,0.95); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 4vw; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--red); letter-spacing: 2px; text-decoration: none; }
        .auth-btn { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .hero-section { padding: 40px 4vw 20px; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
        .filter-select { flex: 1; min-width: 200px; padding: 14px; border-radius: 6px; border: 1px solid #333; background: #141414; color: white; outline: none; cursor: pointer; }
        input { flex: 2; padding: 14px; border-radius: 6px; border: 1px solid #333; background: #141414; color: white; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 0 4vw; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        .card-video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .card-content { padding: 20px; }
        .card-genre { color: var(--red); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .card-title { font-size: 1.2rem; font-weight: bold; color: white; margin-bottom: 10px; }
        .status { padding: 15px 4vw; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #888; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .dot.active { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">STREAM<span>AZURE</span></a>
    <button class="auth-btn">Connexion Microsoft SSO</button>
</nav>

<div class="hero-section">
    <h1>Catalogue Vidéo <span style="color: var(--red);">Cloud</span></h1>
    <div class="controls">
        <input type="text" id="search-input" placeholder="🔍 Rechercher..." oninput="filtrerEtAfficher()">
        <select id="genre-select" class="filter-select" onchange="filtrerEtAfficher()">
            <option value="all">Toutes les catégories</option>
            <option value="Animation">Animation</option>
            <option value="Sci-Fi">Science-Fiction</option>
            <option value="Nature">Nature</option>
        </select>
    </div>
</div>

<div class="status">
    <div id="status-dot" class="dot"></div>
    <span id="status-text">Initialisation...</span>
</div>

<div class="grid" id="video-grid"></div>

<script>
    // On sépare l'URL de la clé pour contourner la sécurité GitHub

    const API_URL = "https://media-api-sarah2026-gthqfhd5ggdngnaa.swedencentral-01.azurewebsites.net/api/GetVideos?code=rw1LwyTdgXCyXmE0reha0mQE4jHN3mEbw40w5YqVqduvAzFuX6STJw==";
    let allVideos = []; 

    async function init() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            // CORRECTIF DE FILTRAGE : On force l'attribution des catégories car elles manquent dans CosmosDB
            allVideos = data.map(v => {
                let cat = "Général";
                const title = v.title.toLowerCase();
                if (title.includes("bunny")) cat = "Animation";
                if (title.includes("éléphants") || title.includes("elephants") || title.includes("video2")) cat = "Sci-Fi";
                if (title.includes("nature") || title.includes("video3")) cat = "Nature";
                return { ...v, category: cat }; // On ajoute le champ category manquant
            });

            filtrerEtAfficher();
            document.getElementById('status-dot').classList.add('active');
            document.getElementById('status-text').innerText = allVideos.length + " vidéos chargées";
        } catch (e) {
            document.getElementById('status-text').innerText = "Erreur de connexion API";
        }
    }

    function filtrerEtAfficher() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const selectedGenre = document.getElementById('genre-select').value;
        
        const resultats = allVideos.filter(v => {
            const matchGenre = (selectedGenre === 'all') || (v.category === selectedGenre);
            const matchTexte = v.title.toLowerCase().includes(query);
            return matchGenre && matchTexte;
        });

        render(resultats);
    }

    function render(liste) {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = liste.map(v => `
            <div class="card">
                <video class="card-video" src="${v.url}" controls></video>
                <div class="card-content">
                    <div class="card-genre">${v.category}</div>
                    <div class="card-title">${v.title}</div>
                    <div class="card-text">${v.description || 'Source : Azure Media Services'}</div>
                </div>
            </div>
        `).join('');
        if(liste.length === 0) grid.innerHTML = "<p>Aucun résultat trouvé.</p>";
    }

    init();
</script>
</body>
</html>
