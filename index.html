<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAzure — Plateforme MediaOnDemand</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <style>
        :root { --red: #e50914; --black: #0a0a0a; --card: #1c1c1c; --text: #e5e5e5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--text); padding-bottom: 50px; min-height: 100vh; }
        nav { background: rgba(0,0,0,0.95); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 4vw; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--red); letter-spacing: 2px; text-decoration: none; }
        .logo span { color: white; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { background: none; border: none; color: #aaa; cursor: pointer; font-size: 1rem; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { color: white; background: #222; }
        .auth-btn { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .auth-btn:hover { background: #b20710; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; padding: 20px; }
        #login-screen h2 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--red); margin-bottom: 10px; }
        #login-screen p { margin-bottom: 25px; color: #aaa; font-size: 1.1rem; }
        .page { display: none; }
        .page.active { display: block; }
        .hero-section { padding: 40px 4vw 20px; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
        .filter-select, input[type="text"] { padding: 14px; border-radius: 6px; border: 1px solid #333; background: #141414; color: white; outline: none; }
        input[type="text"] { flex: 2; width: 100%; }
        .filter-select { flex: 1; min-width: 200px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 0 4vw; margin-top: 30px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: transform 0.3s; }
        .card:hover { transform: scale(1.02); }
        .card-video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .card-content { padding: 20px; }
        .card-genre { color: var(--red); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .card-title { font-size: 1.2rem; font-weight: bold; color: white; margin-bottom: 10px; }
        .status { padding: 15px 4vw; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #888; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .dot.active { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .profil-container { max-width: 600px; margin: 60px auto; padding: 40px; background: var(--card); border-radius: 16px; border: 1px solid #333; }
        .profil-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 20px; }
        .profil-name { text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }
        .profil-email { text-align: center; color: #888; margin-bottom: 30px; }
        .upload-zone { border: 2px dashed #444; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .upload-zone:hover { border-color: var(--red); background: #1a1a1a; }
        .upload-zone input[type="file"] { display: none; }
        .upload-icon { font-size: 3rem; margin-bottom: 15px; }
        .upload-btn { background: var(--red); color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 15px; width: 100%; transition: 0.3s; }
        .upload-btn:hover { background: #b20710; }
        .upload-btn:disabled { background: #444; cursor: not-allowed; }
        .progress-bar { width: 100%; background: #333; border-radius: 10px; height: 10px; margin-top: 15px; display: none; }
        .progress-fill { height: 100%; background: var(--red); border-radius: 10px; width: 0%; transition: width 0.3s; }
        .upload-status { margin-top: 15px; font-size: 0.9rem; color: #888; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; text-decoration: none; transition: 0.2s; }
        .download-btn:hover { background: #555; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">STREAM<span>AZURE</span></a>
    <div class="nav-links" id="nav-links" style="display:none">
        <button class="nav-link active" onclick="showPage('catalogue', this)">🎬 Catalogue</button>
        <button class="nav-link" onclick="showPage('profil', this)">👤 Mon Profil</button>
        <button class="auth-btn" id="nav-auth-btn" onclick="logout()">Déconnexion</button>
    </div>
    <button class="auth-btn" id="login-btn" onclick="login()">Connexion</button>
</nav>

<div id="login-screen">
    <h2>Bienvenue sur StreamAzure</h2>
    <p>Identifiez-vous avec votre compte Microsoft pour accéder au catalogue sécurisé.</p>
    <button class="auth-btn" style="font-size: 1.2rem; padding: 15px 30px;" onclick="login()">Se connecter avec Microsoft</button>
</div>

<div id="main-content" style="display:none">

    <div id="page-catalogue" class="page active">
        <div class="hero-section">
            <h1>Catalogue Vidéo <span style="color: var(--red);">Cloud</span></h1>
            <div class="controls">
                <input type="text" id="search-input" placeholder="🔍 Rechercher via Azure AI Search..." oninput="filtrerEtAfficher()">
                <select id="genre-select" class="filter-select" onchange="filtrerEtAfficher()">
                    <option value="all">Toutes les catégories</option>
                    <option value="Animation">Animation</option>
                    <option value="Sci-Fi">Science-Fiction</option>
                    <option value="Nature">Nature</option>
                </select>
            </div>
        </div>
        <div class="status">
            <div id="status-dot" class="dot"></div>
            <span id="status-text">Prêt</span>
        </div>
        <div class="grid" id="video-grid"></div>
    </div>

    <div id="page-profil" class="page">
        <div class="profil-container">
            <div class="profil-avatar" id="profil-avatar">?</div>
            <div class="profil-name" id="profil-name">-</div>
            <div class="profil-email" id="profil-email">-</div>
            <hr style="border-color: #333; margin: 20px 0;">
            <h3 style="margin-bottom: 15px;">📤 Uploader une vidéo</h3>
            <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                <div class="upload-icon">🎬</div>
                <p>Cliquez pour sélectionner une vidéo</p>
                <p style="color: #666; font-size: 0.85rem; margin-top: 8px;">MP4, AVI, MOV — Max 500MB</p>
                <input type="file" id="file-input" accept="video/*" onchange="fileSelected(this)">
            </div>
            <div id="file-name" style="margin-top: 10px; color: #aaa; font-size: 0.9rem;"></div>
            <button class="upload-btn" id="upload-btn" onclick="uploadVideo()" disabled>Uploader sur Azure</button>
            <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="upload-status" id="upload-status"></div>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://media-api-sarah2026.azurewebsites.net/api/GetVideos";
    const SEARCH_API_URL = "https://media-api-sarah2026.azurewebsites.net/api/SearchVideos"; // Nouvelle URL pour AI Search
    const SAS_URL = "https://sarahmedia2026.blob.core.windows.net/uploads?sp=racwdli&st=2026-02-25T09:48:19Z&se=2027-02-25T18:03:19Z&sv=2024-11-04&sr=c&sig=wN9LEwRXvmGvS%2FYf2HgijNT03wJahYBv9xCNyDhGE4Q%3D";
    const VTT_PROXY = "https://media-api-sarah2026.azurewebsites.net/api/GetVtt?url=";

    const msalConfig = {
        auth: {
            clientId: "5b9eef7e-918e-4c84-970c-5be042939c38",
            authority: "https://login.microsoftonline.com/common",
            redirectUri: "https://sarah202411.github.io/Application-video-zero-code/"
        },
        cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let allVideos = [];
    let selectedFile = null;

    async function initAuth() {
        await msalInstance.initialize();
        const response = await msalInstance.handleRedirectPromise();
        if (response) msalInstance.setActiveAccount(response.account);
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
            msalInstance.setActiveAccount(accounts[0]);
            showApp(accounts[0]);
        }
    }

    async function login() {
        await msalInstance.loginRedirect({ scopes: ["openid", "profile", "User.Read"] });
    }

    function logout() {
        msalInstance.logoutRedirect();
    }

    function showPage(page, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        if (btn) btn.classList.add('active');
    }

    function showApp(account) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('nav-links').style.display = 'flex';
        const name = account.name || account.username;
        document.getElementById('nav-auth-btn').innerText = `Déconnexion (${name.split(' ')[0]})`;
        document.getElementById('profil-avatar').innerText = name.charAt(0).toUpperCase();
        document.getElementById('profil-name').innerText = name;
        document.getElementById('profil-email').innerText = account.username;
        loadVideos();
    }

    function fileSelected(input) {
        selectedFile = input.files[0];
        if (selectedFile) {
            document.getElementById('file-name').innerText = '📁 ' + selectedFile.name;
            document.getElementById('upload-btn').disabled = false;
        }
    }

    async function uploadVideo() {
        if (!selectedFile) return;
        const btn = document.getElementById('upload-btn');
        const status = document.getElementById('upload-status');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');

        btn.disabled = true;
        progressBar.style.display = 'block';
        status.innerText = 'Upload en cours...';

        const fileName = Date.now() + '_' + selectedFile.name;
        const uploadUrl = SAS_URL.replace('?', '/' + fileName + '?');

        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl, true);
        xhr.setRequestHeader('x-ms-blob-type', 'BlockBlob');
        xhr.setRequestHeader('Content-Type', selectedFile.type);

        xhr.upload.onprogress = (e) => {
            const pct = Math.round((e.loaded / e.total) * 100);
            progressFill.style.width = pct + '%';
        };

        xhr.onload = () => {
            if (xhr.status === 201) {
                status.innerText = '✅ Succès ! Traitement Azure lancé.';
                status.style.color = '#2ecc71';
                setTimeout(loadVideos, 3000);
            } else {
                status.innerText = '❌ Erreur ' + xhr.status;
            }
            btn.disabled = false;
        };
        xhr.send(selectedFile);
    }

    async function loadVideos() {
        try {
            const response = await fetch(API_URL);
            allVideos = await response.json();
            render(allVideos);
            document.getElementById('status-dot').classList.add('active');
            document.getElementById('status-text').innerText = allVideos.length + " vidéos chargées";
        } catch (e) {
            document.getElementById('status-text').innerText = "Erreur de connexion.";
        }
    }

    // --- MODIFICATION ICI POUR AZURE AI SEARCH ---
    async function filtrerEtAfficher() {
        const query = document.getElementById('search-input').value.trim();
        const genre = document.getElementById('genre-select').value;
        const statusText = document.getElementById('status-text');

        // Si la barre de recherche est vide et pas de filtre, on recharge tout le catalogue
        if (query === "" && genre === "all") {
            render(allVideos);
            statusText.innerText = allVideos.length + " vidéos disponibles";
            return;
        }

        try {
            statusText.innerText = "🔍 Recherche intelligente...";
            
            // Appel à ton Azure Function qui contient la logique Azure AI Search
            const response = await fetch(`${SEARCH_API_URL}?q=${encodeURIComponent(query)}&genre=${encodeURIComponent(genre)}`);
            const searchResults = await response.json();
            
            render(searchResults);
            statusText.innerText = searchResults.length + " résultat(s) trouvé(s) via AI Search";
        } catch (e) {
            console.error("Erreur Search:", e);
            statusText.innerText = "Utilisation du filtre";
            // Fallback local si l'API Search échoue
            const fallback = allVideos.filter(v => 
                (genre === "all" || v.category === genre) && 
                (v.title || "").toLowerCase().includes(query.toLowerCase())
            );
            render(fallback);
        }
    }

    async function telechargerVtt(vttUrl) {
        const response = await fetch(VTT_PROXY + encodeURIComponent(vttUrl));
        const text = await response.text();
        const blob = new Blob([text], { type: 'text/vtt' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'traduction.vtt';
        a.click();
    }

    function render(liste) {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = '';
        if (liste.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Aucun résultat.</p>";
            return;
        }
        liste.forEach(v => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <video class="card-video" controls>
                    <source src="${v.url}" type="video/mp4">
                </video>
                <div class="card-content">
                    <div class="card-genre">${v.category || 'Général'}</div>
                    <div class="card-title">${v.title || 'Vidéo Azure'}</div>
                    <p style="font-size: 0.85rem; color: #888;">${v.description || 'Source : Azure Storage'}</p>
                    ${v.vttUrl ? `<button class="download-btn" onclick="telechargerVtt('${v.vttUrl}')">📄 Télécharger la traduction</button>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    initAuth();
</script>
</body>
</html>
