<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamAzure — Plateforme MediaOnDemand</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <style>
        :root { --red: #e50914; --black: #0a0a0a; --card: #1c1c1c; --text: #e5e5e5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--text); padding-bottom: 50px; min-height: 100vh; }
        nav { background: rgba(0,0,0,0.95); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 4vw; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--red); letter-spacing: 2px; text-decoration: none; }
        .logo span { color: white; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { background: none; border: none; color: #aaa; cursor: pointer; font-size: 1rem; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { color: white; background: #222; }
        .auth-btn { background: var(--red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .auth-btn:hover { background: #b20710; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; padding: 20px; }
        #login-screen h2 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--red); margin-bottom: 10px; }
        .page { display: none; }
        .page.active { display: block; }
        .hero-section { padding: 40px 4vw 20px; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
        .filter-select, input[type="text"] { padding: 14px; border-radius: 6px; border: 1px solid #333; background: #141414; color: white; outline: none; }
        input[type="text"] { flex: 2; width: 100%; }
        .filter-select { flex: 1; min-width: 200px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 0 4vw; margin-top: 30px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: transform 0.3s; }
        .card:hover { transform: scale(1.02); }
        .card-video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .card-content { padding: 20px; }
        .card-genre { color: var(--red); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .card-title { font-size: 1.2rem; font-weight: bold; color: white; margin-bottom: 10px; }
        .status { padding: 15px 4vw; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; color: #888; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .dot.active { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .profil-container { max-width: 600px; margin: 60px auto; padding: 40px; background: var(--card); border-radius: 16px; border: 1px solid #333; }
        .profil-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 20px; }
        .upload-zone { border: 2px dashed #444; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
        .upload-btn { background: var(--red); color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">STREAM<span>AZURE</span></a>
    <div class="nav-links" id="nav-links" style="display:none">
        <button class="nav-link active" onclick="showPage('catalogue', this)">🎬 Catalogue</button>
        <button class="nav-link" onclick="showPage('profil', this)">👤 Mon Profil</button>
        <button class="auth-btn" onclick="logout()">Déconnexion</button>
    </div>
    <button class="auth-btn" id="login-btn" onclick="login()">Connexion</button>
</nav>

<div id="login-screen">
    <h2>Bienvenue sur StreamAzure</h2>
    <p>Connectez-vous pour accéder à vos contenus.</p>
    <button class="auth-btn" onclick="login()">Se connecter avec Microsoft</button>
</div>

<div id="main-content" style="display:none">
    <div id="page-catalogue" class="page active">
        <div class="hero-section">
            <div class="controls">
                <input type="text" id="search-input" placeholder="🔍 Rechercher une vidéo..." oninput="filtrerEtAfficher()">
                <select id="genre-select" class="filter-select" onchange="filtrerEtAfficher()">
                    <option value="all">Toutes les catégories</option>
                    <option value="Animation">Animation</option>
                    <option value="Sci-Fi">Science-Fiction</option>
                    <option value="Nature">Nature</option>
                    <option value="Général">Général</option>
                </select>
            </div>
        </div>
        <div class="status">
            <div id="status-dot" class="dot"></div>
            <span id="status-text">Chargement...</span>
        </div>
        <div class="grid" id="video-grid"></div>
    </div>

    <div id="page-profil" class="page">
        <div class="profil-container">
            <div class="profil-avatar" id="profil-avatar">?</div>
            <div id="profil-name" style="text-align:center; font-weight:bold; font-size:1.5rem;">-</div>
            <div id="profil-email" style="text-align:center; color:#888; margin-bottom:20px;">-</div>
            <hr style="border: 1px solid #333; margin: 20px 0;">
            <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                <p>🎬 Cliquez pour choisir une vidéo</p>
                <input type="file" id="file-input" accept="video/*" onchange="fileSelected(this)" style="display:none">
            </div>
            <div id="file-name" style="margin-top: 10px; color: #888; text-align:center;"></div>
            <button class="upload-btn" id="upload-btn" onclick="uploadVideo()" disabled>Lancer l'upload</button>
            <div id="upload-status" style="margin-top:15px; text-align:center;"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://media-api-sarah2026.azurewebsites.net/api/GetVideos";
    const SAS_URL = "https://sarahmedia2026.blob.core.windows.net/uploads?sp=racwdli&st=2026-02-25T09:48:19Z&se=2027-02-25T18:03:19Z&sv=2024-11-04&sr=c&sig=wN9LEwRXvmGvS%2FYf2HgijNT03wJahYBv9xCNyDhGE4Q%3D";

    const msalConfig = {
        auth: {
            clientId: "5b9eef7e-918e-4c84-970c-5be042939c38",
            authority: "https://login.microsoftonline.com/common",
            redirectUri: "https://sarah202411.github.io/Application-video-zero-code/"
        }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let allVideos = [];
    let selectedFile = null;

    async function initAuth() {
        await msalInstance.initialize();
        const response = await msalInstance.handleRedirectPromise();
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
            msalInstance.setActiveAccount(accounts[0]);
            showApp(accounts[0]);
        }
    }

    async function login() { await msalInstance.loginRedirect({ scopes: ["User.Read"] }); }
    function logout() { msalInstance.logoutRedirect(); }

    function showPage(page, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        if (btn) btn.classList.add('active');
    }

    function showApp(account) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('nav-links').style.display = 'flex';
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('profil-avatar').innerText = account.username.charAt(0).toUpperCase();
        document.getElementById('profil-name').innerText = account.name || account.username;
        document.getElementById('profil-email').innerText = account.username;
        loadVideos();
    }

    function fileSelected(input) {
        selectedFile = input.files[0];
        if (selectedFile) {
            document.getElementById('file-name').innerText = selectedFile.name;
            document.getElementById('upload-btn').disabled = false;
        }
    }

    async function uploadVideo() {
        const btn = document.getElementById('upload-btn');
        const status = document.getElementById('upload-status');
        btn.disabled = true;
        status.innerText = 'Upload en cours...';

        const uploadUrl = SAS_URL.replace('?', '/' + Date.now() + '_' + selectedFile.name + '?');
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl, true);
        xhr.setRequestHeader('x-ms-blob-type', 'BlockBlob');
        xhr.onload = () => {
            if (xhr.status === 201) {
                status.innerText = '✅ Vidéo envoyée !';
                loadVideos();
            }
        };
        xhr.send(selectedFile);
    }

    async function loadVideos() {
        try {
            const response = await fetch(API_URL);
            allVideos = await response.json();
            filtrerEtAfficher();
            document.getElementById('status-dot').classList.add('active');
            document.getElementById('status-text').innerText = `${allVideos.length} vidéos disponibles`;
        } catch (e) { document.getElementById('status-text').innerText = "Erreur de connexion API."; }
    }

    function filtrerEtAfficher() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const genre = document.getElementById('genre-select').value;
        const filtered = allVideos.filter(v => {
            const matchGenre = (genre === 'all' || v.category === genre);
            const matchTexte = (v.title || "").toLowerCase().includes(query);
            return matchGenre && matchTexte;
        });
        render(filtered);
    }

    function render(liste) {
        document.getElementById('video-grid').innerHTML = liste.map(v => `
            <div class="card">
                <video class="card-video" controls crossorigin="anonymous">
                    <source src="${v.url}" type="video/mp4">
                    ${v.vttUrl ? `<track kind="subtitles" src="${v.vttUrl}" srclang="fr" label="Français" default>` : ''}
                </video>
                <div class="card-content">
                    <div class="card-genre">${v.category || 'Général'}</div>
                    <div class="card-title">${v.title || 'Sans titre'}</div>
                    <p style="font-size: 0.85rem; color: #888;">${v.description || ''}</p>
                </div>
            </div>
        `).join('');
    }

    initAuth();
</script>
</body>
</html>
